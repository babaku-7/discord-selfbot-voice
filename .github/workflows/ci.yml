name: CI

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  check:
    name: Lint & smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify package is app-only (not publishable)
        run: node -e "const pkg=require('./package.json'); if (pkg.private !== true) { console.error('package.json harus private: true (repo ini aplikasi, bukan package npm)'); process.exit(1); }"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint (bot code)
        run: npm run lint

      - name: Smoke tests (voice-handler, account-manager, health, security)
        run: npm test
